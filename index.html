      .sr-only {
        position: absolute;

      function updateMetaTags(data) {
        const personal = data.personal;
        const meta = data.meta;
        const nameParts = personal.name.split(" ");
        const firstName = nameParts[0] || "";
        const lastName = nameParts.slice(1).join(" ") || "";
        const fullTitle = `${personal.name} — ${personal.jobTitle} | Resume`;
        const website = meta.website;

        document.getElementById("page-title").textContent = fullTitle;
        document
          .getElementById("meta-title")
          .setAttribute("content", fullTitle);
        document
          .getElementById("meta-description")
          .setAttribute("content", meta.description);
        document
          .getElementById("meta-keywords")
          .setAttribute("content", meta.keywords);
        document
          .getElementById("meta-author")
          .setAttribute("content", personal.name);

        document
          .getElementById("og-url")
          .setAttribute("content", website + "/");
        document
          .getElementById("og-title")
          .setAttribute("content", `${personal.name} — ${personal.jobTitle}`);
        document
          .getElementById("og-description")
          .setAttribute("content", meta.description);
        document
          .getElementById("og-image")
          .setAttribute("content", website + "/" + personal.avatar);
        document
          .getElementById("og-first-name")
          .setAttribute("content", firstName);
        document
          .getElementById("og-last-name")
          .setAttribute("content", lastName);
        const githubUrl = data.social.github || "";
        const username = githubUrl
          ? githubUrl.split("/").pop()
          : "yourusername";
        document
          .getElementById("og-username")
          .setAttribute("content", username);

        document
          .getElementById("twitter-url")
          .setAttribute("content", website + "/");
        document
          .getElementById("twitter-title")
          .setAttribute("content", `${personal.name} — ${personal.jobTitle}`);
        document
          .getElementById("twitter-description")
          .setAttribute("content", meta.description);
        document
          .getElementById("twitter-image")
          .setAttribute("content", website + "/" + personal.avatar);
        document
          .getElementById("twitter-creator")
          .setAttribute("content", "@" + username);

        document
          .getElementById("canonical")
          .setAttribute("href", website + "/");
        document
          .getElementById("favicon")
          .setAttribute("href", personal.avatar);
      }

      function renderPersonalInfo(data) {
        const personal = data.personal;
        const social = data.social;

        const avatarImg = document.getElementById("avatar-img");
        avatarImg.src = personal.avatar;
        avatarImg.alt = `${personal.name} - ${personal.jobTitle} profile photo`;

        document.getElementById("name-heading").textContent = personal.name;
        document.getElementById("job-title").textContent = personal.jobTitle;

        const contactInfo = document.getElementById("contact-info");
        contactInfo.innerHTML = `
          <div>
            <a
              href="mailto:${personal.email}"
              class="text-gray-700 hover:text-gray-900 no-underline hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded px-1"
              >${personal.email}</a
            >
          </div>
          <div>
            <a
              href="tel:${personal.phone}"
              class="text-gray-700 hover:text-gray-900 no-underline hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded px-1"
              >${personal.phone}</a
            >
          </div>
          <div class="text-gray-600">${personal.location}</div>
          ${Object.entries(social)
            .map(([key, url]) => {
              const displayName = url
                .replace("https://www.", "")
                .replace("https://", "")
                .replace("http://", "");
              return `
          <div>
            <a
              href="${url}"
              target="_blank"
              rel="noopener"
              class="text-gray-700 hover:text-gray-900 no-underline hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded px-1"
              >${displayName}</a
            >
          </div>`;
            })
            .join("")}
        `;

        const cvLink = document.getElementById("cv-download-link");
        cvLink.href = personal.cvFile;
        cvLink.download = personal.cvFileName;
      }

      function renderSummary(data) {
        const summaryContent = document.getElementById("summary-content");
        summaryContent.innerHTML = data.summary
          .map(
            (paragraph) =>
              `<p class="mb-3 text-gray-700 leading-relaxed">${paragraph}</p>`
          )
          .join("");
      }

      function renderExperience(data) {
        const experienceContent = document.getElementById("experience-content");
        experienceContent.innerHTML = data.experience
          .map(
            (exp) => `
          <div class="mb-6">
            <h3 class="mt-1 mb-2 text-lg font-bold text-gray-900">
              ${exp.title},
              <a
                href="${exp.companyUrl}"
                target="_blank"
                rel="noopener"
                class="text-gray-900 hover:text-blue-600 no-underline hover:underline transition-colors"
                >${exp.company}</a
              >
            </h3>
            <div class="text-gray-600 text-sm flex gap-3 flex-wrap mb-3">
              <span class="font-medium">${exp.period}</span>
              <span class="text-gray-500">•</span>
              <span>${exp.location}</span>
            </div>
            <ul class="my-2 ml-6 pl-0 list-disc space-y-2">
              ${exp.responsibilities
                .map(
                  (resp) =>
                    `<li class="pl-2 leading-relaxed text-gray-700">${resp}</li>`
                )
                .join("")}
            </ul>
          </div>
        `
          )
          .join("");
      }

      function renderProjects(data) {
        const projectsContent = document.getElementById("projects-content");
        projectsContent.innerHTML = data.projects
          .map(
            (project) => `
          <div class="mb-6">
            <h3 class="mt-1 mb-2 text-lg font-bold text-gray-900">
              ${project.name}
            </h3>
            <div class="text-sm text-gray-600 mb-3 font-medium">
              ${project.type} | ${project.role} (${project.technologies})
            </div>
            <p class="mb-3 text-gray-700 leading-relaxed">
              ${project.description}
            </p>
          </div>
        `
          )
          .join("");
      }

      function renderSkills(data) {
        const skillsContent = document.getElementById("skills-content");
        skillsContent.innerHTML = data.skills
          .map(
            (skill) =>
              `<span
            class="inline-block px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-full text-sm text-gray-700 font-medium hover:bg-gray-100 hover:border-gray-300 transition-colors"
            >${skill}</span
          >`
          )
          .join("");
      }

      function renderEducation(data) {
        const educationContent = document.getElementById("education-content");
        educationContent.innerHTML = data.education
          .map(
            (edu) => `
          <div class="mb-6">
            <h3 class="mt-1 mb-2 text-lg font-bold text-gray-900">
              ${edu.degree},
              <a
                href="${edu.institutionUrl}"
                target="_blank"
                rel="noopener"
                class="text-gray-900 hover:text-blue-600 no-underline hover:underline transition-colors"
                >${edu.institution}</a
              >
            </h3>
            <div class="text-gray-600 text-sm flex gap-3 flex-wrap">
              <span class="font-medium">${edu.period}</span>
              <span class="text-gray-500">•</span>
              <span>${edu.location}</span>
            </div>
          </div>
        `
          )
          .join("");
      }

      function renderCertificates(data) {
        const certificatesContent = document.getElementById(
          "certificates-content"
        );
        certificatesContent.innerHTML = data.certificates
          .map(
            (cert) => `
          <li class="pl-2 leading-relaxed text-gray-700">
            <a
              href="${cert.url}"
              target="_blank"
              rel="noopener"
              class="text-gray-900 hover:text-gray-700 no-underline hover:underline transition-colors"
              >${cert.name}</a
            >
          </li>
        `
          )
          .join("");
      }

      function renderStructuredData(data) {
        const personal = data.personal;
        const meta = data.meta;
        const nameParts = personal.name.split(" ");
        const locationParts = personal.location.split(", ");
        const city = locationParts[0] || "";
        const country = locationParts[1] || "";

        const personSchema = {
          "@context": "https://schema.org",
          "@type": "Person",
          name: personal.name,
          jobTitle: personal.jobTitle,
          url: meta.website,
          image: meta.website + "/" + personal.avatar,
          email: personal.email,
          telephone: personal.phone,
          address: {
            "@type": "PostalAddress",
            addressLocality: city,
            addressCountry: country,
          },
          sameAs: Object.values(data.social),
          knowsAbout: data.skills,
          alumniOf: data.education.map((edu) => ({
            "@type": "EducationalOrganization",
            name: edu.institution,
            url: edu.institutionUrl,
            address: {
              "@type": "PostalAddress",
              addressLocality: edu.location.split(", ")[0] || "",
              addressCountry: edu.location.split(", ")[1] || "",
            },
          })),
          hasCredential: data.certificates.map((cert) => ({
            "@type": "EducationalOccupationalCredential",
            credentialCategory: "certification",
            name: cert.name,
            recognizedBy: {
              "@type": "Organization",
              name: "Organization Name",
            },
          })),
          worksFor:
            data.experience.length > 0
              ? {
                  "@type": "Organization",
                  name: data.experience[0].company,
                  url: data.experience[0].companyUrl,
                }
              : undefined,
          description: meta.description,
        };

        if (!personSchema.worksFor) {
          delete personSchema.worksFor;
        }

        document.getElementById("structured-data-person").textContent =
          JSON.stringify(personSchema);

        const webpageSchema = {
          "@context": "https://schema.org",
          "@type": "WebPage",
          name: `${personal.name} - Resume`,
          description: `Professional resume of ${personal.name} - ${personal.jobTitle}`,
          url: meta.website,
          about: {
            "@type": "Person",
            name: personal.name,
            jobTitle: personal.jobTitle,
          },
          mainEntity: {
            "@type": "Person",
            name: personal.name,
            jobTitle: personal.jobTitle,
          },
        };

        document.getElementById("structured-data-webpage").textContent =
          JSON.stringify(webpageSchema);
      }

      loadResumeData();
    </script>
  </body>
</html>
